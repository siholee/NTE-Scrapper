name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:win
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: NTE-Scrapper-Windows
          path: dist-release/*.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem dist-release/*.exe | ForEach-Object FullName)
          gh release view $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -eq 0) { gh release upload $env:GITHUB_REF_NAME @files --clobber }
          else { gh release create $env:GITHUB_REF_NAME @files --title "NTE Scrapper $env:GITHUB_REF_NAME" --generate-notes }
